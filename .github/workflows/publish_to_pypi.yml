---
name: Release

concurrency:
  group: changelog
  cancel-in-progress: false

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:

  # ── 1. Bump versions, commit, push branch, open PR ──────────────────────
  bump:
    name: Bump
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the version bump branch and update release metadata.
      pull-requests: write # Open the version bump PR for review.

    outputs:
      branch: ${{ steps.release.outputs.branch }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the branch the release targets, not the tag, so the
          # commit we push can be fast-forward merged back into main.
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.15' }

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump, commit, push branch and open PR
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          BASE_BRANCH: ${{ github.event.release.target_commitish }}
          REPO: ${{ github.repository }}
        run: |
          # One command does everything the bump job used to do in shell:
          # bump changelog + version files, branch, [skip ci] commit,
          # --force-with-lease push, and open the release PR. The [skip ci]
          # decision follows [defaults].skip_ci (default true).
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          VERSION="${RELEASE_VERSION#v}"
          uv run kaclm release-bump \
            --version "$VERSION" \
            --base "$BASE_BRANCH" \
            --release-id "$RELEASE_ID" \
            --repository "$REPO" \
            --open-pr \
            --title "chore: release ${VERSION}" \
            --body "Automated release PR for ${VERSION}. Merge once the PyPI publish succeeds." \
            --github-output --yes

  # ── 2. Build the distribution from the bump branch ──────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: bump

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build from the bump branch so pyproject.toml carries the correct
          # version.  Building from the original tag would give the old version.
          ref: ${{ needs.bump.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.15' }

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Release checks
        run: uv run --all-extras python scripts/check.py

      - name: Build
        run: uv build --no-sources

      - name: Verify dist version matches release
        env:
          EXPECTED: ${{ needs.bump.outputs.version }}
        run: |
          # Check that the wheel filename contains the expected version.
          WHEEL=$(ls dist/*.whl 2>/dev/null | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No wheel found in dist/"
            exit 1
          fi
          if ! echo "$WHEEL" | grep -q "${EXPECTED}"; then
            echo "::error::Wheel ${WHEEL} does not contain expected version ${EXPECTED}"
            exit 1
          fi
          echo "Verified: ${WHEEL} matches version ${EXPECTED}"

      # Fail here, in the build job, rather than in `publish` where a metadata
      # problem is invisible until after the release is already tagged.
      # Validate with current Twine before attempting the upload.
      - name: Validate distribution metadata
        run: uv run --with 'twine>=7' twine check --strict dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # ── 3. Publish to PyPI via OIDC ─────────────────────────────────────────
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Authenticate the PyPI trusted-publisher upload.
    environment:
      name: pypi
      url: https://pypi.org/p/openmock

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: 'true'
